  :root{color-scheme:light;--ink:#172333;--muted:#657487;--blue:#1768ed;--line:#e8ebef;--paper:#fffef9;--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif}
  *{box-sizing:border-box}
  body{margin:0;background:#f5f6f8;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}button{border:0;background:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #72a8fd;outline-offset:3px}button:disabled{cursor:default}
  [hidden]{display:none!important}.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
  .wrap{width:min(1152px,calc(100% - 72px));margin-inline:auto}.bar{height:59px;background:white;border-bottom:1px solid #e9ecf0}.bar-inner{height:100%;display:flex;align-items:center;gap:30px}.brand{color:#1772fb;font-size:32px;font-weight:550;letter-spacing:-3px;line-height:1}.nav{display:flex;gap:24px;color:#65717f;align-items:center;font-size:15px}.nav a:hover{color:var(--ink)}.search{display:flex;align-items:center;margin-left:auto;background:#f6f7f9;border:1px solid #e7ebf0;border-radius:22px;padding:0 6px 0 15px;max-width:265px;flex:1;height:34px;color:#738092}.search input{width:100%;border:0;background:transparent;outline:0;min-width:0;font-size:13px}.search button{padding:4px 6px;display:grid;place-items:center}.ask{background:var(--blue);color:#fff;border-radius:18px;padding:5px 16px;font-size:14px;margin-left:-18px}

<script>
  const pages = [
    {title:'一场雨，从鼻尖开始',text:['久旱后的第一场雨，常常还没淋湿衣角，就先送来一股泥土的气味。','许多人熟悉这种味道，却很难用一个词形容。它藏在干燥的泥土里，等着一滴水把它带到空气中。']},
    {title:'雨滴里的小气泡',text:['雨滴落在疏松的土壤上，水与地面之间会<mark>裹住</mark>微小的气泡。','气泡上浮，随后破裂。带着气味的微粒<mark>散入</mark>空气，落进我们的呼吸里。']},
    {title:'泥土里藏着的气味',text:['土壤里生活着许多微生物。有些放线菌会产生一种叫作<mark>土臭素</mark>的物质。它的名字听上去不太讨喜，闻起来却像潮湿的泥土。','植物留下的油性物质也可能参与其中。不同地方的土壤、植被和天气，悄悄改变着每场雨的气味。']},
    {title:'从脚下走到鼻尖',text:['风把携带着气味物质的小颗粒带到附近。呼吸之间，鼻子捕捉到土臭素的踪迹，人就闻见了熟悉的泥土气息。','所以，雨后的空气里同时发生着两件事：微生物提供了一部分<mark>气味来源</mark>，雨滴碰撞地面则帮它完成了<mark>传播</mark>。']},
    {title:'为什么每场雨都不一样',text:['同一条小路，久旱之后的第一场雨和连阴雨里的一个下午，闻起来也会不同。落雨前的干湿程度、地面的孔隙和风，都能影响气味的传播。','从花园走到铺着石板的街道，你闻到的变化，也可能只是脚下的<mark>地面变了</mark>。']},
    {title:'再闻到时，想起这一滴雨',text:['下回遇到阵雨，可以留意最初几分钟的变化。先闻到气味，还是先看见地面的水迹？在草地旁和屋檐下，感受是否一样？','这股我们叫作“雨的味道”的气息，留下了一条很短的线索：<mark>土壤、雨滴、空气</mark>，最后是正在呼吸的你。']}
  ];
  const $=id=>document.getElementById(id);
  const mobile=matchMedia('(max-width:680px)');
  const stride=()=>mobile.matches?1:2;
  let anchor=0, bookOpen=true, lastScroll=window.scrollY;
  function makePage(page,index,book) {
    const section=document.createElement('section');
    section.dataset.page=index;
    if(book){section.className='leaf';const running=document.createElement('div');running.className='running';running.textContent=index%2?'雨后的气味':'林间手记';section.append(running)}
    const heading=document.createElement('h2');heading.textContent=page.title;section.append(heading);
    const content=document.createElement('div');content.className='page-copy';
    if(book&&index===1){const sketch=document.createElement('span');sketch.className='drop-study';sketch.role='img';sketch.setAttribute('aria-label','雨滴落在土壤上的插画');content.append(sketch)}
    for(const copy of page.text){const p=document.createElement('p');p.innerHTML=copy;content.append(p)}section.append(content);
    if(book){const number=document.createElement('div');number.className='folio';number.textContent='—　'+(index+2)+'　—';section.append(number)}
    return section;
  }
  for(const [i,page] of pages.entries())$('original').append(makePage(page,i,false));
  function render(direction=0) {
    const first=anchor-anchor%stride(),end=Math.min(first+stride(),pages.length);
    $('spread').replaceChildren(...pages.slice(first,end).map((p,i)=>makePage(p,first+i,true)));
    $('place').textContent=(stride()===1?String(first+1):[first+1,end].join(' – '))+' / '+pages.length+' 页';
    $('progress').style.width=(end/pages.length*100)+'%';
    $('prev').disabled=first===0;$('next').disabled=end===pages.length;
    $('spread').classList.remove('turn-forward','turn-back');
    if(direction){void $('spread').offsetWidth;$('spread').classList.add(direction>0?'turn-forward':'turn-back')}
  }
  function turn(direction){const first=anchor-anchor%stride(),next=first+stride()*direction;if(next<0||next>=pages.length)return;anchor=next;render(direction)}
  $('next').onclick=()=>turn(1);$('prev').onclick=()=>turn(-1);
  mobile.addEventListener('change',()=>render());
  addEventListener('keydown',event=>{if(!bookOpen||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('input,textarea,select,form'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();turn(event.key==='ArrowLeft'?-1:1)}});
  let touch=null;$('stage').addEventListener('touchstart',e=>{touch=e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null},{passive:true});
  $('stage').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];touch=null;if(Math.abs(dx)>45&&Math.abs(dx)>2*Math.abs(dy))turn(dx<0?1:-1)},{passive:true});
  $('stage').addEventListener('touchcancel',()=>{touch=null});
  function selectOriginalAnchor(){
    if(bookOpen||Math.abs(window.scrollY-lastScroll)<8)return;
    const target=window.innerHeight*.4;
    const sections=Array.from($('original').children);
    const visible=sections.filter(s=>{const rect=s.getBoundingClientRect();return rect.bottom>0&&rect.top<innerHeight});
    if(visible.length)anchor=Number(visible.reduce((a,b)=>Math.abs(a.getBoundingClientRect().top-target)<=Math.abs(b.getBoundingClientRect().top-target)?a:b).dataset.page);
    lastScroll=window.scrollY;
  }
  window.addEventListener('scroll',selectOriginalAnchor,{passive:true});
  $('mode').onclick=()=>{
    if(!bookOpen)selectOriginalAnchor();
    bookOpen=!bookOpen;$('stage').hidden=!bookOpen;$('original').hidden=bookOpen;
    $('mode').querySelector('span').textContent=bookOpen?'退出双页阅读':'看山陪读 · 双页阅读';
    render();
    if(bookOpen){$('answer').scrollIntoView({block:'start'})}else{$('original').children[anchor].scrollIntoView({block:'center'});lastScroll=window.scrollY}
  };
  $('highlight').onclick=()=>{$('highlight').setAttribute('aria-pressed',$('answer').classList.toggle('marked'))};
  for(const [id,off,on] of [['vote','赞同','已赞同'],['save','收藏','已收藏']]){
    const button=$(id);button.onclick=()=>{const value=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(value));button.querySelector('span').textContent=value?on:off};
  }
  $('commentsButton').onclick=()=>{const open=$('comments').hidden;$('comments').hidden=!open;$('commentsButton').setAttribute('aria-expanded',String(open));if(open)$('commentText').focus()};
  $('commentForm').onsubmit=e=>{e.preventDefault();const text=$('commentText').value.trim();if(!text)return;const p=document.createElement('p');p.textContent=text;$('messages').append(p);$('commentText').value=''};
  render();
</script>
</html>
